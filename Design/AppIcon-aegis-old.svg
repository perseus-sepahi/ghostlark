<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- HIG: artwork lives on an 824px squircle centered in the 1024 canvas -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101F3F"/>
      <stop offset="1" stop-color="#071226"/>
    </linearGradient>
    <linearGradient id="shield" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#4FB2FF"/>
      <stop offset="0.55" stop-color="#2E9BF5"/>
      <stop offset="1" stop-color="#22D3A6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#2E9BF5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2E9BF5" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="26" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="shieldClip">
      <path d="M 250 236 Q 250 196 290 196 L 734 196 Q 774 196 774 236 L 774 520 Q 774 722 512 858 Q 250 722 250 520 Z"/>
    </clipPath>
  </defs>

  <g transform="translate(100 100) scale(0.8046875)">
  <!-- macOS rounded-square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#glow)"/>
  <!-- faint network grid: the proxy mesh behind the shield -->
  <g stroke="#3A5C9A" stroke-opacity="0.35" stroke-width="4" fill="none">
    <circle cx="512" cy="520" r="392"/>
    <circle cx="512" cy="520" r="470" stroke-opacity="0.18"/>
  </g>
  <g fill="#6FB6FF" fill-opacity="0.55">
    <circle cx="512" cy="128" r="11"/>
    <circle cx="904" cy="520" r="11"/>
    <circle cx="120" cy="520" r="11"/>
    <circle cx="512" cy="912" r="11"/>
  </g>

  <!-- shield -->
  <g filter="url(#shadow)">
    <path d="M 250 236 Q 250 196 290 196 L 734 196 Q 774 196 774 236 L 774 520 Q 774 722 512 858 Q 250 722 250 520 Z" fill="url(#shield)"/>
  </g>
  <path d="M 250 236 Q 250 196 290 196 L 734 196 Q 774 196 774 236 L 774 520 Q 774 722 512 858 Q 250 722 250 520 Z" fill="url(#gloss)"/>
  <!-- inner rim -->
  <path d="M 292 268 Q 292 240 320 240 L 704 240 Q 732 240 732 268 L 732 516 Q 732 690 512 806 Q 292 690 292 516 Z"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="10"/>

  <!-- the "A": two legs, plus a tunnel crossbar with endpoint nodes -->
  <g clip-path="url(#shieldClip)">
    <path d="M 512 338 L 396 690" stroke="#FFFFFF" stroke-width="74" stroke-linecap="round" fill="none"/>
    <path d="M 512 338 L 628 690" stroke="#FFFFFF" stroke-width="74" stroke-linecap="round" fill="none"/>
  </g>
  <!-- tunnel through the shield -->
  <path d="M 322 586 L 702 586" stroke="#0B1B3A" stroke-opacity="0.35" stroke-width="58" stroke-linecap="round" fill="none"/>
  <path d="M 322 586 L 702 586" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" fill="none"/>
  <circle cx="322" cy="586" r="40" fill="#FFFFFF"/>
  <circle cx="702" cy="586" r="40" fill="#FFFFFF"/>
  <circle cx="322" cy="586" r="18" fill="#22D3A6"/>
  <circle cx="702" cy="586" r="18" fill="#22D3A6"/>
  </g>
</svg>
